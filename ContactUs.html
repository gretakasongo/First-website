<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h1>Contact Us</h1>
    <a href="mailto:gretakasongo07@gmail.com">
        <img src="Images/Email.jpg" width="100" height="100">
    </a>
    <br>
    <table bgcolor="white" background="Images/background.jpg">
        <tr>
            <td>
              <form name="contact" id="contact" method="post" 
                action="/submit"
                autocomplete="on">
               <filedset>
               <legend>Contact Us</legend>
               <label for="name">Name:</label>
               <input type="text" name="name" id="name" required>
               <br><br>
               <label for="surname">Surname:</label>
               <input type="text" name="surname" id="surname" required>
               <br><br>
               <label for="phone">Phone:</label>
               <input type="tel" name="phone" id="phone" required>
               <br><br>
               <label for="email">Email:</label>
               <input type="email" name="email" id="email" required>
               <br><br>
               <label for="topic">Topic:</label>
               <select name="topic" id="topic" required>
                   <option value="">Select a topic</option>
                   <option value="general">General Inquiry</option>
                   <option value="support">Support</option>
                   <option value="feedback">Feedback</option>
               </select>
               <br><br>
               <label for="message">Message:</label>
               <textarea name="message" id="message" rows="5" required></textarea>
               <br><br>
               <input type="submit" value="Submit">
               </filedset>
             </form>
           </td>
        </tr>
        
    </table>
    
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3308.767113307736!2d18.466956975524194!3d-33.972824873187086!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc5d1dd01d9e8d%3A0xaad0cc66371c04ac!2sEmeris%20-%20Cape%20Town%20Newlands%20Campus!5e0!3m2!1sfr!2sza!4v1788348808839!5m2!1sfr!2sza"
     width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
</body>
</html>
